version: 2
updates:
  # One pull request a month for all npm updates. Security updates are
  # separate and are opened as soon as an advisory is published.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
